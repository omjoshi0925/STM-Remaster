name: ios-build
# The exact build the device uses: generate the Xcode project with CMake and
# build the app for iphoneos without signing. No game assets are needed.
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate the Xcode project
        run: |
          cmake -G Xcode -S NativePort -B build-ios -DCMAKE_SYSTEM_NAME=iOS \
                -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
      - name: Build for iphoneos (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project build-ios/SpiderManTotalMayhemNative.xcodeproj -target SpiderManTotalMayhem \
                     -sdk iphoneos CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E 'error:|BUILD' || true
          grep -E ': error:|^error:' build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          if ! grep -q 'BUILD SUCCEEDED' build.log; then
            # no compiler error line: surface the tail (link, signing or project errors)
            tail -25 build.log | while IFS= read -r l; do [ -n "$l" ] && echo "::warning::${l:0:300}"; done
            exit 1
          fi
